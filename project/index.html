<!DOCTYPE html>
<html>

<head lang="en">
    <meta charset="UTF-8">
    <title>Prairie</title>
    <link rel="icon" href="data:,">

    <style>
        body,
        html {
            border: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }

        #game-over-overlay h1 {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            color: #c1121f;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #game-over-overlay p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        #restart-button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            background-color: #c1121f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #restart-button:hover {
            background-color: #e63946;
        }
    </style>
</head>

<body>

    <div id="game-over-overlay">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-button">Restart Adventure</button>
    </div>

    <script type="module" src="main.js"></script>

</body>

</html>
